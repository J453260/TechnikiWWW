<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona – Techniki WWW</title>
    
    <!-- Baza: Bootstrap 5 (daje gotowe komponenty i narzędzia) -->
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page my-4">

    <!-- Nagłówek stylizowany przez Flexbox z CSS -->
    <header id="header">
        <h1>Przykładowa strona w HTML</h1>
        <p>Projekt w ramach kursu Techniki WWW</p>
    </header>

    <!-- <main> jest rodzicem Flexboxa (zdefiniowanym w style.css) -->
    <main>

        <!-- Karta 1: dziecko flexboxa z flex 1 -->
        <section class="card">
            <h2>Opis projektu</h2>
            <p>Przykładowa strona łącząca Bootstrapa oraz własny układ Flexbox.</p>
            <div class="box mt-auto">
                Techniki WWW
            </div>
        </section>

        <!-- Karta 2: drugie dziecko flexboxa z flex 1 -->
        <section id="contact" class="card">
            <h2>Kontakt</h2>
            <!-- Tutaj wykorzystujemy flexboxowe klasy narzędziowe Bootstrapa: -->
            <div class="d-flex align-items-center gap-2">
                <strong>Adres e-mail:</strong>
                <a href="mailto:xyz@student.uj.edu.pl">xyz@student.uj.edu.pl</a>
            </div>
        </section>

    </main>

    <footer>
        &copy; 2026 Techniki WWW. Wszelkie prawa zastrzeżone.
    </footer>

</div>

</body>
</html>
