<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona – Techniki WWW</title>
    <!-- Dołączenie Bootstrap 5 -->
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-3 p-md-4">

    <!-- Główny kontener o maks. szerokości, wycentrowany, z białym tłem, zaokrągleniami i cieniem -->
    <div class="container bg-white rounded-4 shadow-sm overflow-hidden p-0" style="max-width: 900px;">

        <!-- NAGŁÓWEK: Flexbox pionowy, zielone tło, wyśrodkowany tekst -->
        <header class="bg-success text-white text-center p-4 d-flex flex-column align-items-center justify-content-center gap-2">
            <h1 class="h2 m-0 fw-bold">Przykładowa strona w HTML</h1>
            <p class="m-0 opacity-75">Projekt w ramach kursu Techniki WWW</p>
        </header>

        <!-- ZAWARTOŚĆ GŁÓWNA: Kontener Flexbox z zawijaniem i odstępem -->
        <main class="p-4 d-flex flex-column flex-md-row gap-4">

            <!-- KARTA 1: Opis projektu (flex-fill daje efekt 'flex: 1') -->
            <section class="card flex-fill border rounded-3 p-3 shadow-none">
                <div class="card-body p-0 d-flex flex-column">
                    <h2 class="card-title h4 mb-3">Opis projektu</h2>
                    <p class="card-text text-secondary mb-3">
                        Przykładowa strona oparta na bibliotece Bootstrap 5 i wbudowanym Flexboxie.
                    </p>
                    
                    <!-- Odpowiednik klasy .box: jasne tło, zielony pasek z lewej, zaokrąglenie -->
                    <div class="bg-light border-start border-4 border-success p-3 rounded-end mt-auto">
                        <strong></strong> Przykładowa strona www
                    </div>
                </div>
            </section>

            <!-- KARTA 2: Kontakt (lekko zielonkawe tło) -->
            <section class="card flex-fill border rounded-3 p-3 bg-success-subtle shadow-none">
                <div class="card-body p-0">
                    <h2 class="card-title h4 mb-3 text-success-emphasis">Kontakt</h2>
                    
                    <!-- Flexbox w jednym rzędzie: etykieta + link -->
                    <div class="d-flex align-items-center gap-2">
                        <strong class="text-dark">Adres e-mail:</strong>
                        <a href="mailto:xyz@student.uj.edu.pl" class="text-success fw-bold text-decoration-none">
                            xyz@student.uj.edu.pl
                        </a>
                    </div>
                </div>
            </section>

        </main>

        <!-- STOPKA: szare tło, wyśrodkowany, przygaszony tekst -->
        <footer class="bg-light text-secondary text-center py-3 border-top small">
            &copy; 2026 Techniki WWW. Wszelkie prawa zastrzeżone.
        </footer>

    </div>

</body>
</html>
